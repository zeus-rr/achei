<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Processando Localização...</title>
</head>
<body>

    <p>Aguarde, obtendo sua localização e abrindo o WhatsApp...</p>

    <script>
        // Executa a função assim que a página termina de carregar
        window.onload = function() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(posicao) {
                    let lat = posicao.coords.latitude;
                    let lon = posicao.coords.longitude;
                    
                    let numero = "5521967813618";
                    let texto = encodeURIComponent(`Minha localização atual: https://google.com{lat},${lon}`);
                    
                    let urlWhatsApp = `https://whatsapp.com{numero}&text=${texto}`;
                    
                    // Redireciona a própria aba para o WhatsApp de forma direta
                    window.location.href = urlWhatsApp;
                }, function(erro) {
                    alert("Erro ao obter a localização: " + erro.message);
                });
            } else {
                alert("Seu navegador não suporta geolocalização.");
            }
        };
    </script>

</body>
</html>
